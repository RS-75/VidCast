<style>
  :root{
    --bg:#ECE3D0;
    --card:#F8F2E4;
    --card-soft:#F2EADA;
    --ink:#3B3226;
    --ink-soft:#948868;
    --ink-faint:#B3A88A;
    --line:#DDD1B2;
    --accent:#B8863B;
    --accent-soft:#EAD9AF;
    --sage:#71805F;
    --sage-soft:#DEE3CD;
    --rust:#A5573F;
    --rust-soft:#EAD2C7;
    --gcal:#5B7FA6;
    --gcal-soft:#E9EEF3;
  }
  
  [data-theme="dark"] {
    --bg: #121212;
    --card: #1C1C1C;
    --card-soft: #2C2C2C;
    --ink: #EAEAEA;
    --ink-soft: #A1A1A1;
    --ink-faint: #6B6B6B;
    --line: #3A3A3A;
    --accent: #D4A373;
    --accent-soft: #5C462C;
    --sage: #8DA37A;
    --sage-soft: #303A25;
    --rust: #CC7A64;
    --rust-soft: #4D2B23;
    --gcal: #759BCA;
    --gcal-soft: #263345;
  }

  /* Liquid Glass Clair (Bleu & Blanc) */
  [data-theme="glass-light"] {
    --bg: linear-gradient(135deg, #f0f8ff 0%, #a1c4fd 100%);
    --card: rgba(255, 255, 255, 0.5);
    --card-soft: rgba(255, 255, 255, 0.3);
    --ink: #0f172a;
    --ink-soft: #334155;
    --ink-faint: #64748b;
    --line: rgba(255, 255, 255, 0.6);
    --accent: #0284c7;
    --accent-soft: rgba(2, 132, 199, 0.2);
    --sage: #059669;
    --rust: #dc2626;
  }

  /* Liquid Glass Sombre (Noir & Bleu) */
  [data-theme="glass-dark"] {
    --bg: linear-gradient(135deg, #020617 0%, #0f172a 50%, #082f49 100%);
    --card: rgba(30, 41, 59, 0.5);
    --card-soft: rgba(30, 41, 59, 0.3);
    --ink: #f8fafc;
    --ink-soft: #cbd5e1;
    --ink-faint: #94a3b8;
    --line: rgba(56, 189, 248, 0.15);
    --accent: #38bdf8;
    --accent-soft: rgba(56, 189, 248, 0.2);
    --sage: #34d399;
    --rust: #f87171;
  }

  [data-theme^="glass"] body, [data-theme^="glass"] .full-page-overlay {
    background: var(--bg);
    background-attachment: fixed;
  }
